[package]
name = "schema"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "schema"
path = "src/main.rs"

[lib]
name = "gbrain_schema"
path = "src/lib.rs"

[dependencies]
kyyn-core = "0.1.16"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
kyyn-schema-build = "0.1.16"

[dev-dependencies]
sha2 = "0.10"

[workspace]
